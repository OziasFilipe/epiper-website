<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Visão detalhada da Plataforma Epiper</title><desc id="desc">Diagrama com Hub Epiper, Pedido Eletrônico, Televendas, Operação conectada, Implantação guiada e Evolução por módulos.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6f46ff"/><stop offset="1" stop-color="#9b7cff"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4d33a8" flood-opacity=".12"/></filter></defs><g font-family="Satoshi,Arial,sans-serif"><g stroke="#b9a8ef" stroke-width="3" fill="none"><path d="M600 365C460 320 350 250 275 180"/><path d="M600 365C750 320 850 250 930 180"/><path d="M600 385C455 395 350 405 270 430"/><path d="M600 385C750 395 860 405 940 430"/><path d="M600 405C465 470 360 555 285 610"/><path d="M600 405C745 470 850 555 930 610"/></g><g fill="#fff" stroke="#e6dffc" stroke-width="2" filter="url(#s)"><rect x="410" y="280" width="380" height="230" rx="34"/><rect x="90" y="90" width="360" height="170" rx="28"/><rect x="750" y="90" width="360" height="170" rx="28"/><rect x="65" y="345" width="380" height="170" rx="28"/><rect x="755" y="345" width="380" height="170" rx="28"/><rect x="90" y="550" width="370" height="155" rx="28"/><rect x="740" y="550" width="370" height="155" rx="28"/></g><rect x="545" y="315" width="110" height="44" rx="22" fill="url(#g)"/><text x="600" y="343" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">EPIPER</text><text x="600" y="405" text-anchor="middle" fill="#251b49" font-size="34" font-weight="900">Plataforma Epiper</text><text x="600" y="445" text-anchor="middle" fill="#716a88" font-size="20">Ecossistema comercial conectado</text><text x="600" y="478" text-anchor="middle" fill="#6f46ff" font-size="17" font-weight="700">Varejo · Atacado · Distribuição · ERP</text><g fill="#251b49" font-size="25" font-weight="850"><text x="130" y="145">Hub Epiper</text><text x="790" y="145">Pedido Eletrônico</text><text x="110" y="400">Televendas</text><text x="800" y="400">Operação conectada</text><text x="130" y="605">Implantação guiada</text><text x="780" y="605">Evolução por módulos</text></g><g fill="#716a88" font-size="18"><text x="130" y="182">Centraliza soluções, acessos</text><text x="130" y="207">e visão da operação.</text><text x="790" y="182">Canal B2B para clientes,</text><text x="790" y="207">vendedores e representantes.</text><text x="110" y="438">Atendimento, equipe e</text><text x="110" y="463">gestão comercial.</text><text x="800" y="438">ERP, pedido e retorno</text><text x="800" y="463">dentro do mesmo fluxo.</text><text x="130" y="643">Configuração e homologação</text><text x="130" y="668">acompanhadas de ponta a ponta.</text><text x="780" y="643">Ampliação conforme a prioridade</text><text x="780" y="668">e maturidade da operação.</text></g><g fill="#6f46ff"><circle cx="275" cy="180" r="8"/><circle cx="930" cy="180" r="8"/><circle cx="270" cy="430" r="8"/><circle cx="940" cy="430" r="8"/><circle cx="285" cy="610" r="8"/><circle cx="930" cy="610" r="8"/></g></g></svg>