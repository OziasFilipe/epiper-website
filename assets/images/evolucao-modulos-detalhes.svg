<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Evolução por módulos</title><desc id="desc">Escada de crescimento com base comercial, Pedido Eletrônico, Televendas, Integrações, Indicadores e novos módulos.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6f46ff"/><stop offset="1" stop-color="#1dbf73"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4c349b" flood-opacity=".12"/></filter></defs><g font-family="Satoshi,Arial,sans-serif"><text x="600" y="70" text-anchor="middle" fill="#251b49" font-size="34" font-weight="900">Evolução por módulos, sem reconstruir tudo</text><text x="600" y="103" text-anchor="middle" fill="#716a88" font-size="18">Comece pelo essencial e amplie conforme a prioridade da operação.</text><path d="M115 590C340 530 520 430 680 325C850 215 960 170 1090 135" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round"/><g fill="#fff" stroke="#e4dcfb" stroke-width="2" filter="url(#s)"><rect x="65" y="445" width="175" height="200" rx="26"/><rect x="245" y="385" width="175" height="260" rx="26"/><rect x="425" y="325" width="175" height="320" rx="26"/><rect x="605" y="265" width="175" height="380" rx="26"/><rect x="785" y="205" width="175" height="440" rx="26"/><rect x="965" y="145" width="175" height="500" rx="26"/></g><g fill="url(#g)"><circle cx="152" cy="475" r="22"/><circle cx="332" cy="415" r="22"/><circle cx="512" cy="355" r="22"/><circle cx="692" cy="295" r="22"/><circle cx="872" cy="235" r="22"/><circle cx="1052" cy="175" r="22"/></g><g fill="#fff" font-size="16" font-weight="900" text-anchor="middle"><text x="152" y="481">01</text><text x="332" y="421">02</text><text x="512" y="361">03</text><text x="692" y="301">04</text><text x="872" y="241">05</text><text x="1052" y="181">06</text></g><g fill="#251b49" font-size="19" font-weight="850" text-anchor="middle"><text x="152" y="530">Base comercial</text><text x="332" y="470">Pedido Eletrônico</text><text x="512" y="410">Televendas</text><text x="692" y="350">Integrações</text><text x="872" y="290">Indicadores</text><text x="1052" y="230">Novos módulos</text></g><g fill="#716a88" font-size="14" text-anchor="middle"><text x="152" y="563">Comece pelo</text><text x="152" y="585">essencial.</text><text x="332" y="503">Digitalize</text><text x="332" y="525">os pedidos.</text><text x="512" y="443">Organize equipe</text><text x="512" y="465">e atendimento.</text><text x="692" y="383">Conecte ERP</text><text x="692" y="405">e sistemas.</text><text x="872" y="323">Decida com</text><text x="872" y="345">mais dados.</text><text x="1052" y="263">Amplie quando</text><text x="1052" y="285">fizer sentido.</text></g><g fill="#f4f0ff"><rect x="230" y="675" width="220" height="52" rx="18"/><rect x="490" y="675" width="220" height="52" rx="18"/><rect x="750" y="675" width="220" height="52" rx="18"/></g><g fill="#6f46ff" font-size="16" font-weight="850" text-anchor="middle"><text x="340" y="707">Escalável</text><text x="600" y="707">Sem reconstruir tudo</text><text x="860" y="707">Crescimento guiado</text></g></g></svg>