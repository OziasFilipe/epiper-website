<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Detalhes do Televendas Epiper</title><desc id="desc">Diagrama com atendimento com contexto, equipe comercial, sugestões, registro do pedido, metas e relacionamento.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6f46ff"/><stop offset="1" stop-color="#1dbf73"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4b3498" flood-opacity=".12"/></filter></defs><g font-family="Satoshi,Arial,sans-serif"><g stroke="#bcaaf0" stroke-width="3" fill="none"><path d="M600 380C470 315 390 240 310 170"/><path d="M600 380C730 315 810 240 890 170"/><path d="M600 390C455 390 350 390 250 390"/><path d="M600 390C745 390 850 390 950 390"/><path d="M600 405C470 475 390 555 310 620"/><path d="M600 405C730 475 810 555 890 620"/></g><rect x="420" y="275" width="360" height="250" rx="34" fill="#fff" stroke="#e4dcfb" stroke-width="2" filter="url(#s)"/><circle cx="600" cy="335" r="38" fill="#f0eaff"/><path d="M582 338v-8a18 18 0 0 1 36 0v8M579 338v20h12v-20h-12Zm30 0v20h12v-20h-12Z" fill="none" stroke="#6f46ff" stroke-width="6" stroke-linecap="round"/><text x="600" y="418" text-anchor="middle" fill="#251b49" font-size="34" font-weight="900">Televendas</text><text x="600" y="455" text-anchor="middle" fill="#716a88" font-size="18">Atendimento, equipe e gestão comercial</text><rect x="495" y="480" width="210" height="34" rx="17" fill="#f1edff"/><text x="600" y="503" text-anchor="middle" fill="#6f46ff" font-size="15" font-weight="800">Cliente · pedido · resultado</text><g fill="#fff" stroke="#e4dcfb" stroke-width="2" filter="url(#s)"><rect x="55" y="80" width="340" height="175" rx="27"/><rect x="805" y="80" width="340" height="175" rx="27"/><rect x="40" y="305" width="355" height="175" rx="27"/><rect x="805" y="305" width="355" height="175" rx="27"/><rect x="55" y="535" width="340" height="150" rx="27"/><rect x="805" y="535" width="340" height="150" rx="27"/></g><g fill="#251b49" font-size="23" font-weight="850"><text x="95" y="132">Atendimento com contexto</text><text x="845" y="132">Registro do pedido</text><text x="80" y="357">Equipe comercial</text><text x="845" y="357">Meta e indicadores</text><text x="95" y="587">Sugestões e apoio</text><text x="845" y="587">Relacionamento</text></g><g fill="#716a88" font-size="17"><text x="95" y="170">Cliente, histórico e informações</text><text x="95" y="196">dentro do mesmo fluxo.</text><text x="845" y="170">Venda consultiva com registro</text><text x="845" y="196">padronizado e organizado.</text><text x="80" y="395">Rotina de atendimento mais clara</text><text x="80" y="421">para vendedores e gestores.</text><text x="845" y="395">Produtividade, volume de vendas</text><text x="845" y="421">e acompanhamento de resultados.</text><text x="95" y="624">Informações e recursos para</text><text x="95" y="650">ganhar agilidade durante a venda.</text><text x="845" y="624">Mais contexto para responder</text><text x="845" y="650">melhor e vender com qualidade.</text></g><g fill="url(#g)"><circle cx="310" cy="170" r="8"/><circle cx="890" cy="170" r="8"/><circle cx="250" cy="390" r="8"/><circle cx="950" cy="390" r="8"/><circle cx="310" cy="620" r="8"/><circle cx="890" cy="620" r="8"/></g></g></svg>