<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Detalhes do Pedido Eletrônico</title><desc id="desc">Diagrama com catálogo, preço e estoque, condições comerciais, carrinho, acompanhamento e experiência B2B.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6f46ff"/><stop offset="1" stop-color="#8e70ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4b3498" flood-opacity=".12"/></filter></defs><g font-family="Satoshi,Arial,sans-serif"><g stroke="#bbaaf0" stroke-width="3" fill="none"><path d="M600 380C470 320 390 245 310 175"/><path d="M600 380C730 320 810 245 890 175"/><path d="M600 390C450 390 350 390 250 390"/><path d="M600 390C750 390 850 390 950 390"/><path d="M600 405C470 475 390 555 310 620"/><path d="M600 405C730 475 810 555 890 620"/></g><rect x="420" y="275" width="360" height="250" rx="34" fill="#fff" stroke="#e3dbfb" stroke-width="2" filter="url(#s)"/><rect x="525" y="310" width="150" height="48" rx="24" fill="url(#g)"/><text x="600" y="341" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">PEDIDO B2B</text><text x="600" y="405" text-anchor="middle" fill="#251b49" font-size="31" font-weight="900">Pedido Eletrônico</text><text x="600" y="442" text-anchor="middle" fill="#716a88" font-size="18">Compra digital com regras da operação</text><rect x="505" y="470" width="190" height="34" rx="17" fill="#f4efff"/><text x="600" y="493" text-anchor="middle" fill="#6f46ff" font-size="15" font-weight="800">Integrado ao ERP ↔</text><g fill="#fff" stroke="#e4dcfb" stroke-width="2" filter="url(#s)"><rect x="55" y="85" width="340" height="170" rx="27"/><rect x="805" y="85" width="340" height="170" rx="27"/><rect x="40" y="310" width="355" height="170" rx="27"/><rect x="805" y="310" width="355" height="170" rx="27"/><rect x="55" y="535" width="340" height="150" rx="27"/><rect x="805" y="535" width="340" height="150" rx="27"/></g><g fill="#251b49" font-size="23" font-weight="850"><text x="95" y="135">Catálogo e mix</text><text x="845" y="135">Carrinho e fechamento</text><text x="80" y="360">Preço e estoque</text><text x="845" y="360">Acompanhamento</text><text x="95" y="585">Condições comerciais</text><text x="845" y="585">Experiência B2B</text></g><g fill="#716a88" font-size="17"><text x="95" y="172">Produtos organizados para compra</text><text x="95" y="198">com busca e navegação simples.</text><text x="845" y="172">Pedido rápido, conferido</text><text x="845" y="198">e padronizado antes do envio.</text><text x="80" y="397">Consulta comercial no momento</text><text x="80" y="423">da montagem do pedido.</text><text x="845" y="397">Status do pedido, separação</text><text x="845" y="423">e retorno para o cliente.</text><text x="95" y="622">Regras, descontos e condições</text><text x="95" y="648">aplicadas à operação.</text><text x="845" y="622">Canal digital para clientes,</text><text x="845" y="648">representantes e distribuidores.</text></g><g fill="#6f46ff"><circle cx="310" cy="175" r="8"/><circle cx="890" cy="175" r="8"/><circle cx="250" cy="390" r="8"/><circle cx="950" cy="390" r="8"/><circle cx="310" cy="620" r="8"/><circle cx="890" cy="620" r="8"/></g></g></svg>