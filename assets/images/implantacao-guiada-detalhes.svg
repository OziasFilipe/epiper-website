<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Etapas da implantação guiada</title><desc id="desc">Jornada em seis etapas: descoberta, mapeamento, configuração, integração, homologação e go-live com acompanhamento.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6f46ff"/><stop offset="1" stop-color="#1dbf73"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4b3498" flood-opacity=".11"/></filter></defs><g font-family="Satoshi,Arial,sans-serif"><text x="600" y="72" text-anchor="middle" fill="#251b49" font-size="34" font-weight="900">Implantação guiada, etapa por etapa</text><text x="600" y="106" text-anchor="middle" fill="#716a88" font-size="18">Do entendimento do cenário até a entrada em produção.</text><path d="M110 355H1090" stroke="#d9cff7" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#e6dffc" stroke-width="2" filter="url(#s)"><rect x="45" y="190" width="165" height="300" rx="26"/><rect x="235" y="190" width="165" height="300" rx="26"/><rect x="425" y="190" width="165" height="300" rx="26"/><rect x="615" y="190" width="165" height="300" rx="26"/><rect x="805" y="190" width="165" height="300" rx="26"/><rect x="995" y="190" width="165" height="300" rx="26"/></g><g fill="url(#g)"><circle cx="128" cy="215" r="25"/><circle cx="318" cy="215" r="25"/><circle cx="508" cy="215" r="25"/><circle cx="698" cy="215" r="25"/><circle cx="888" cy="215" r="25"/><circle cx="1078" cy="215" r="25"/></g><g fill="#fff" font-size="18" font-weight="900" text-anchor="middle"><text x="128" y="222">1</text><text x="318" y="222">2</text><text x="508" y="222">3</text><text x="698" y="222">4</text><text x="888" y="222">5</text><text x="1078" y="222">6</text></g><g fill="#251b49" font-size="19" font-weight="850" text-anchor="middle"><text x="128" y="285">Descoberta</text><text x="318" y="285">Mapeamento</text><text x="508" y="285">Configuração</text><text x="698" y="285">Integração</text><text x="888" y="285">Homologação</text><text x="1078" y="278">Go-live e</text><text x="1078" y="302">acompanhamento</text></g><g fill="#716a88" font-size="14" text-anchor="middle"><text x="128" y="330">Cenário comercial</text><text x="128" y="355">e objetivos</text><text x="318" y="330">Regras, cadastros</text><text x="318" y="355">e processos</text><text x="508" y="330">Ambiente ajustado</text><text x="508" y="355">à operação</text><text x="698" y="330">ERP, APIs</text><text x="698" y="355">e fluxos</text><text x="888" y="330">Validação com</text><text x="888" y="355">a empresa</text><text x="1078" y="340">Produção com</text><text x="1078" y="365">suporte</text></g><g fill="#f5f1ff"><rect x="65" y="395" width="125" height="58" rx="16"/><rect x="255" y="395" width="125" height="58" rx="16"/><rect x="445" y="395" width="125" height="58" rx="16"/><rect x="635" y="395" width="125" height="58" rx="16"/><rect x="825" y="395" width="125" height="58" rx="16"/><rect x="1015" y="395" width="125" height="58" rx="16"/></g><g fill="#6f46ff" font-size="13" font-weight="800" text-anchor="middle"><text x="128" y="429">Planejamento</text><text x="318" y="429">Organização</text><text x="508" y="429">Parametrização</text><text x="698" y="429">Conexão</text><text x="888" y="429">Testes</text><text x="1078" y="429">Acompanhamento</text></g><g fill="#fff" stroke="#e1d8fa" filter="url(#s)"><rect x="190" y="560" width="245" height="80" rx="22"/><rect x="478" y="560" width="245" height="80" rx="22"/><rect x="766" y="560" width="245" height="80" rx="22"/></g><g fill="#251b49" font-size="18" font-weight="850" text-anchor="middle"><text x="313" y="593">Projeto orientado</text><text x="600" y="593">Etapas claras</text><text x="889" y="593">Validação antes da virada</text></g><g fill="#716a88" font-size="14" text-anchor="middle"><text x="313" y="618">Acompanhamento próximo</text><text x="600" y="618">Responsabilidades definidas</text><text x="889" y="618">Mais segurança no go-live</text></g></g></svg>