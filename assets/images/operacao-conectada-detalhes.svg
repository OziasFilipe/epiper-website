="374">Regras</text><text x="320" y="290">Dados atualizados</text><text x="320" y="318">Fluxo seguro</text><text x="320" y="346">Integração confiável</text><text x="525" y="285">Pedido Eletrônico</text><text x="525" y="315">Televendas</text><text x="525" y="355">Venda com contexto</text><text x="730" y="290">Validação</text><text x="730" y="318">Regras de negócio</text><text x="730" y="346">Envio</text><text x="925" y="290">Separação</text><text x="925" y="318">Faturamento</text><text x="925" y="346">Expedição</text><text x="1098" y="290">Status</text><text x="1098" y="318">Rastreio</text><text x="1098" y="346">Ocorrências</text></g><g fill="#f3efff"><rect x="448" y="385" width="154" height="54" rx="16"/><rect x="260" y="550" width="220" height="70" rx="22"/><rect x="490" y="550" width="220" height="70" rx="22"/><rect x="720" y="550" width="220" height="70" rx="22"/></g><text x="525" y="419" text-anchor="middle" fill="#251b49" font-size="17" font-weight="800">Pedido + Televendas</text><g fill="#251b49" font-size="17" font-weight="800" text-anchor="middle"><text x="370" y="580">Menos retrabalho</text><text x="600" y="580">Mais contexto</text><text x="830" y="580">Retorno da operação</text></g><g fill="#716a88" font-size="14" text-anchor="middle"><text x="370" y="604">Uma fonte de informação</text><text x="600" y="604">Dados perto da venda</text><text x="830" y="604">Visibilidade e controle</text></g><rect x="475" y="650" width="250" height="58" rx="20" fill="#fff" stroke="#dcd1f7"/><text x="600" y="685" text-anchor="middle" fill="#6f46ff" font-size="18" font-weight="850">Dados e status voltam ao ERP ↔</text></g></svg>