<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">Implantação guiada Epiper</title><desc id="d">Etapas de diagnóstico, configuração, integração, homologação, go-live e acompanhamento.</desc><defs><linearGradient id="p" x1="0" x2="1"><stop stop-color="#7a56f7"/><stop offset="1" stop-color="#5e3ad0"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2cc66c"/><stop offset="1" stop-color="#18a854"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5735a7" flood-opacity=".11"/></filter></defs><path d="M92 344C228 182 410 164 520 302c93 117 194 111 346-84" fill="none" stroke="#d4c8f7" stroke-width="4" stroke-dasharray="9 11"/><g filter="url(#s)" font-family="Arial,sans-serif"><g transform="translate(40 330)"><rect width="132" height="150" rx="24" fill="#fff"/><circle cx="28" cy="28" r="18" fill="url(#p)"/><text x="28" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="20" y="72" font-size="16" font-weight="700" fill="#2b2054">Diagnóstico</text><text x="20" y="98" font-size="11" fill="#766d8d">Mapeamento da</text><text x="20" y="116" font-size="11" fill="#766d8d">operação e requisitos</text></g><g transform="translate(186 236)"><rect width="132" height="150" rx="24" fill="#fff"/><circle cx="28" cy="28" r="18" fill="url(#p)"/><text x="28" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="20" y="72" font-size="16" font-weight="700" fill="#2b2054">Configuração</text><text x="20" y="98" font-size="11" fill="#766d8d">Parâmetros, regras</text><text x="20" y="116" font-size="11" fill="#766d8d">e cadastros iniciais</text></g><g transform="translate(332 176)"><rect width="132" height="150" rx="24" fill="#fff"/><circle cx="28" cy="28" r="18" fill="url(#p)"/><text x="28" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="20" y="72" font-size="16