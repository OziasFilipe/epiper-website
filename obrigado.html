<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <meta property="og:image" content="https://epiper.com.br/assets/epiper.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Contato recebido | ePiper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thank-you-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #ffffff 0%, #f0f2f5 100%); padding: 1rem; }
    .thank-you-box { text-align: center; background: #fff; border-radius: 24px; padding: 3rem 2.5rem; max-width: 480px; width: 100%; box-shadow: 0 24px 80px rgba(0,0,0,0.06); border: 1px solid #e2e8f2; }
    .thank-you-box .check { width: 72px; height: 72px; background: linear-gradient(140deg, #1fb053, #179644); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem; color: #fff; }
    .thank-you-box h1 { font-size: 1.8rem; color: #1f242d; margin-bottom: 0.75rem; }
    .thank-you-box p { color: #5b6b82; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
    .thank-you-box .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 2rem; background: #1f5de8; color: #fff; text-decoration: none; border-radius: 999px; font-weight: 600; font-size: 0.95rem; transition: transform 0.2s; }
    .thank-you-box .btn-primary:hover { transform: translateY(-2px); }
    .thank-you-box .logo { width: 140px; margin-bottom: 0.5rem; }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ePiper Tecnologia",
    "url": "https://epiper.com.br",
    "logo": "https://epiper.com.br/assets/epiper.png",
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+55-27-99621-7169",
      "contactType": "sales",
      "email": "contato@epiper.com.br"
    }
  }
  </script>
</head>
<body>
  <main class="thank-you-page">
    <div class="thank-you-box">
      <img src="assets/epiper.png" alt="ePiper" class="logo" />
      <div class="check">&#10003;</div>
      <h1>Solicitacao enviada</h1>
      <p>Recebemos seus dados. Nosso time comercial vai entrar em contato em breve para apresentar a solucao ideal para sua empresa.</p>
      <a class="btn-primary" href="index.html">Voltar ao site</a>
    </div>
  </main>
</body>
</html>
